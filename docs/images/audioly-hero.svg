<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Audioly — Find your frequency</title><desc id="desc">Mint and blue Audioly waveform on a midnight background.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071024"/><stop offset="1" stop-color="#0b0829"/></linearGradient><linearGradient id="brand"><stop stop-color="#8df9ce"/><stop offset=".48" stop-color="#05c9eb"/><stop offset="1" stop-color="#6449ff"/></linearGradient><radialGradient id="glow"><stop stop-color="#3b40bb" stop-opacity=".4"/><stop offset="1" stop-color="#272568" stop-opacity="0"/></radialGradient><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8d9bd9" stroke-opacity=".045"/></pattern></defs>
