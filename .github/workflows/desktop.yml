name: Build Audioly desktop
on:
  push:
    tags: ['v[0-9]*', 'desktop-v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: false
        default: ''
      publish:
        description: Attach downloads to the matching existing GitHub release
        type: boolean
        default: false
permissions:
  contents: read
env:
  AUDIOLY_VERSION: ${{ inputs.version }}
jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${AUDIOLY_VERSION:-$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')}"
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]\.[0-9](-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid version" >&2; exit 1; }
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"


      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Paudioly.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Paudioly.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Audioly/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libaudioly_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          bash desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/Audioly \
            dist/Audioly-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/Audioly-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/Audioly-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Windows native compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Add native tools to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${AUDIOLY_VERSION:-$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')}"
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]\.[0-9](-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid version" >&2; exit 1; }
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"


      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Paudioly.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Paudioly.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Audioly/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/audioly_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # The native Windows frame bridge must be packaged as well.
          jar tf "$jar" | grep -q 'native/audioly_window.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/Audioly-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Audioly-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/Audioly-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/Audioly/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${AUDIOLY_VERSION:-$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')}"
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]\.[0-9](-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid version" >&2; exit 1; }
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"


      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Paudioly.version=${{ steps.version.outputs.value }}

      - name: Build DMG, PKG and the app bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Paudioly.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Audioly.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Collect
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/Audioly-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/Audioly-$v-macos-$arch.pkg"
          done
          ditto -c -k --keepParent desktopApp/build/compose/binaries/main/app/Audioly.app "dist/Audioly-$v-macos-$arch.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  publish:
    name: Publish desktop downloads
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: downloads
      - name: Verify downloads and create checksums
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(python3 scripts/release_version.py show)
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$version" ]; then
            echo 'Publishing requires the version in version.properties.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          for suffix in linux-x86_64.AppImage linux-amd64.deb linux-x86_64.rpm \
            windows-x64-setup.exe windows-x64.msi windows-x64-portable.zip \
            macos-arm64.dmg macos-arm64.pkg macos-arm64.zip \
            macos-x64.dmg macos-x64.pkg macos-x64.zip; do
            test -s "downloads/Audioly-$version-$suffix"
          done
          git archive --format=zip --output="downloads/Audioly-$version-source.zip" HEAD
          cd downloads
          sha256sum Audioly-* > Audioly-desktop-SHA256SUMS.txt
      - name: Attach files to the production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Android publishes the release first; desktop jobs may finish sooner.
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" downloads/* --clobber
              exit 0
            fi
            sleep 20
          done
          echo "Production release $RELEASE_TAG is not available yet." >&2
          exit 1
