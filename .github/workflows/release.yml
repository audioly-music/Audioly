name: Build Audioly release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: bash scripts/ci/setup-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64, subprocess
          from pathlib import Path
          names = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          values_from_secrets = {name: os.environ.get(name, '').rstrip('\r\n') for name in names}
          missing = [name for name in names if not values_from_secrets[name]]
          if missing:
              raise SystemExit('Configure all four Android signing secrets before building a release.')
          store = Path(os.environ['RUNNER_TEMP']) / 'audioly-release.jks'
          store.write_bytes(base64.b64decode(''.join(values_from_secrets['KEYSTORE_BASE64'].split()), validate=True))
          store.chmod(0o600)
          check_env = os.environ.copy()
          check_env['AUDIOLY_STORE_PASSWORD'] = values_from_secrets['STORE_PASSWORD']
          result = subprocess.run(['keytool', '-list', '-keystore', str(store),
                                   '-storepass:env', 'AUDIOLY_STORE_PASSWORD',
                                   '-alias', values_from_secrets['KEY_ALIAS']],
                                  env=check_env, capture_output=True)
          if result.returncode:
              raise SystemExit('Signing key validation failed. Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS against the private-signing files.')
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t').replace(' ', '\\ ')
          values = {'storeFile': str(store), 'storePassword': values_from_secrets['STORE_PASSWORD'],
                    'keyAlias': values_from_secrets['KEY_ALIAS'], 'keyPassword': values_from_secrets['KEY_PASSWORD']}
          props = Path('keystore.properties')
          props.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in values.items()), encoding='utf-8')
          props.chmod(0o600)
          PY
      - name: Build production APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease --max-workers=2
      - name: Verify production identity and signature
        run: |
          apk=$(find app/build/outputs/apk/prod/release -name '*universal*.apk' -print -quit)
          test -n "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          badging=$("$tools" dump badging "$apk")
          printf '%s\n' "$badging" | grep -q "^package: name='com.music.audioly'"
          printf '%s\n' "$badging" | grep -q "^application-label:'Audioly'$"
          "$(dirname "$tools")/apksigner" verify "$apk"
          mkdir -p release
          cp "$apk" release/Audioly.apk
          cd release
          sha256sum Audioly.apk > Audioly.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Audioly-release
          path: release/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/audioly-release.jks"
